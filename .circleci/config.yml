version: 2.1

jobs:
  build:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout

      - run:
          name: Install build dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y build-essential texinfo libjpeg-dev libpng-dev libelf-dev \
              git subversion python3 wget curl gettext bison flex libgmp-dev libmpfr-dev libmpc-dev \
              meson ninja-build pkg-config libisofs-dev gnupg zstd

      - run:
          name: Prepare workspace cache directory
          command: |
            mkdir -p .circleci-cache

      # 1) CircleCI's own cache (bump v4 -> v5 to force a fresh pull from GitHub)
      - restore_cache:
          keys:
            - kos-sh-elf-ubuntu2404-v4

      - run:
          name: Restore SH-4 toolchain from CircleCI cache
          command: |
            if [ -x .circleci-cache/sh-elf/bin/sh-elf-gcc ]; then
              sudo mkdir -p /opt/toolchains/dc
              sudo rm -rf /opt/toolchains/dc/sh-elf
              sudo cp -a .circleci-cache/sh-elf /opt/toolchains/dc/sh-elf
              sudo chown -R "$USER":"$USER" /opt/toolchains/dc/sh-elf
              echo "Restored SH-4 compiler from CircleCI cache."
            else
              echo "No CircleCI-cached SH-4 compiler."
            fi

      # 2) Cache miss -> grab the toolchain GitHub Actions already built.
      #    Uses the same SSH key CircleCI used for `checkout`, so no token needed.
      - run:
          name: Fetch SH-4 toolchain from GitHub (over SSH)
          command: |
            if [ -x /opt/toolchains/dc/sh-elf/bin/sh-elf-gcc ]; then
              echo "Toolchain already present, skipping GitHub fetch."
              exit 0
            fi

            cat > /tmp/fetch-toolchain.sh <<'EOF'
            set -euo pipefail
            BRANCH="${TOOLCHAIN_BRANCH:-toolchain-cache}"
            REMOTE="$(git -C "$HOME/project" remote get-url origin)"
            TMP="$(mktemp -d)"

            echo "Cloning branch '$BRANCH' from $REMOTE ..."
            git clone --quiet --depth 1 --branch "$BRANCH" "$REMOTE" "$TMP/repo"
            cd "$TMP/repo"
            sha256sum -c SHA256SUMS

            sudo mkdir -p /opt/toolchains/dc
            sudo chown -R "$USER":"$USER" /opt/toolchains
            rm -rf /opt/toolchains/dc/sh-elf
            cat sh-elf.tar.zst.part-* | zstd -dc | tar -xf - -C /opt/toolchains/dc

            /opt/toolchains/dc/sh-elf/bin/sh-elf-gcc --version > /dev/null
            echo "SH-4 toolchain fetched from GitHub."
            EOF

            if ! bash /tmp/fetch-toolchain.sh; then
              echo "GitHub fetch failed, falling back to building from source."
              rm -rf /opt/toolchains/dc/sh-elf
            fi

      # 3) Still nothing -> build from source (slow path, last resort)
      - run:
          name: Build SH-4 toolchain if still missing
          command: |
            if [ ! -x /opt/toolchains/dc/sh-elf/bin/sh-elf-gcc ]; then
              sudo mkdir -p /opt/toolchains/dc
              sudo chown -R "$USER":"$USER" /opt/toolchains
              git clone --depth 1 https://github.com/KallistiOS/KallistiOS.git /opt/toolchains/dc/kos
              cp /opt/toolchains/dc/kos/doc/environ.sh.sample /opt/toolchains/dc/kos/environ.sh
              cd /opt/toolchains/dc/kos/utils/kos-chain
              cp Makefile.dreamcast.cfg Makefile.cfg
              sed -i "s/^makejobs=.*/makejobs=$(nproc)/" Makefile.cfg
              make
            else
              echo "Using existing SH-4 toolchain."
            fi

      - run:
          name: Stage SH-4 toolchain for CircleCI cache
          command: |
            if [ -x .circleci-cache/sh-elf/bin/sh-elf-gcc ]; then
              echo "Already in CircleCI cache, nothing to stage."
            else
              mkdir -p .circleci-cache
              rm -rf .circleci-cache/sh-elf
              cp -a /opt/toolchains/dc/sh-elf .circleci-cache/sh-elf
            fi

      - save_cache:
          key: kos-sh-elf-ubuntu2404-v4
          paths:
            - .circleci-cache/sh-elf

      - run:
          name: Build KallistiOS
          command: |
            if [ ! -f /opt/toolchains/dc/kos/environ.sh ]; then
              sudo mkdir -p /opt/toolchains/dc
              sudo chown -R "$USER":"$USER" /opt/toolchains
              git clone --depth 1 https://github.com/KallistiOS/KallistiOS.git /opt/toolchains/dc/kos
              cp /opt/toolchains/dc/kos/doc/environ.sh.sample /opt/toolchains/dc/kos/environ.sh
            fi
            . /opt/toolchains/dc/kos/environ.sh
            cd "$KOS_BASE"
            make -j"$(nproc)"

      # ROM repo access without any environment variable:
      # CircleCI > Project Settings > SSH Keys > Additional SSH Keys (hostname: github.com)
      - add_ssh_keys

      - run:
          name: Download ROM from private repo using the CircleCI SSH key
          command: |
            ROM_REPO="git@github.com:tester305/smw-dc-rom.git"
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null

            # CircleCI names the added key files itself, so try each key until one can read the ROM repo.
            KEY=""
            for k in "$HOME"/.ssh/id_*; do
              case "$k" in *.pub) continue ;; esac
              [ -f "$k" ] || continue
              if GIT_SSH_COMMAND="ssh -i $k -o IdentitiesOnly=yes" \
                  git ls-remote --exit-code "$ROM_REPO" refs/heads/main > /dev/null 2>&1; then
                KEY="$k"
                break
              fi
            done
            if [ -z "$KEY" ]; then
              echo "ERROR: no SSH key in this job can read $ROM_REPO."
              echo "Add its deploy key under Project Settings > SSH Keys (hostname github.com)."
              exit 1
            fi
            echo "Using key file $(basename "$KEY")"

            GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes" \
              git clone --depth 1 --branch main "$ROM_REPO" "$HOME/smw-dc-rom"

            # Plain smw.sfc (private repo) or encrypted smw.sfc.gpg, whichever is there
            if [ -f "$HOME/smw-dc-rom/smw.sfc" ]; then
              cp "$HOME/smw-dc-rom/smw.sfc" ./smw.sfc
              test -s smw.sfc
            else
              cp "$HOME/smw-dc-rom/smw.sfc.gpg" ./smw.sfc.gpg
              test -s smw.sfc.gpg
            fi

      - run:
          name: Decrypt ROM and build
          command: |
            if [ -f smw.sfc.gpg ] && [ -n "${SMW_ROM_PASSPHRASE:-}" ]; then
              gpg --batch --yes --pinentry-mode loopback --passphrase "$SMW_ROM_PASSPHRASE" -o smw.sfc -d smw.sfc.gpg
            elif [ -f smw.sfc ]; then
              echo "Using supplied smw.sfc"
            else
              echo "ERROR: Add your encrypted smw.sfc.gpg file and set SMW_ROM_PASSPHRASE in CircleCI project environment variables."
              exit 1
            fi
            . /opt/toolchains/dc/kos/environ.sh
            ./build.sh smw.sfc
            rm -f smw.sfc
            test -s smw_dc.elf

      - run:
          name: Build mkdcdisc
          command: |
            git clone --depth 1 https://gitlab.com/simulant/mkdcdisc.git "$HOME/mkdcdisc"
            cd "$HOME/mkdcdisc"
            meson setup builddir
            meson compile -C builddir
            test -x builddir/mkdcdisc

      - run:
          name: Create CDI images
          command: |
            "$HOME/mkdcdisc/builddir/mkdcdisc" -e smw_dc.elf -o smw_dc_burn_ready.cdi -n "SMW"
            "$HOME/mkdcdisc/builddir/mkdcdisc" -N -e smw_dc.elf -o smw_dc.cdi -n "SMW"
            test -s smw_dc_burn_ready.cdi
            test -s smw_dc.cdi
            ls -lh smw_dc.elf smw_dc_burn_ready.cdi smw_dc.cdi

      - store_artifacts:
          path: smw_dc.elf
          destination: smw_dc.elf
      - store_artifacts:
          path: smw_dc_burn_ready.cdi
          destination: smw_dc_burn_ready.cdi
      - store_artifacts:
          path: smw_dc.cdi
          destination: smw_dc.cdi

workflows:
  build_on_push:
    jobs:
      - build
