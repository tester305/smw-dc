version: 2.1

jobs:
  build:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout

      - run:
          name: Install build dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y build-essential texinfo libjpeg-dev libpng-dev libelf-dev \
              git subversion python3 wget curl gettext bison flex libgmp-dev libmpfr-dev libmpc-dev \
              meson ninja-build pkg-config libisofs-dev gnupg

      - run:
          name: Prepare workspace cache directory
          command: |
            mkdir -p .circleci-cache

      - restore_cache:
          keys:
            - kos-sh-elf-ubuntu2404-v3

      - run:
          name: Restore SH-4 toolchain from workspace cache
          command: |
            if [ -x .circleci-cache/sh-elf/bin/sh-elf-gcc ]; then
              sudo mkdir -p /opt/toolchains/dc
              sudo cp -a .circleci-cache/sh-elf /opt/toolchains/dc/sh-elf
              sudo chown -R "$USER":"$USER" /opt/toolchains/dc/sh-elf
              echo "Restored cached SH-4 compiler."
            else
              echo "No cached SH-4 compiler found."
            fi

      - run:
          name: Build SH-4 toolchain if cache is missing
          command: |
            if [ ! -x /opt/toolchains/dc/sh-elf/bin/sh-elf-gcc ]; then
              sudo mkdir -p /opt/toolchains/dc
              sudo chown -R "$USER":"$USER" /opt/toolchains
              git clone --depth 1 https://github.com/KallistiOS/KallistiOS.git /opt/toolchains/dc/kos
              cp /opt/toolchains/dc/kos/doc/environ.sh.sample /opt/toolchains/dc/kos/environ.sh
              cd /opt/toolchains/dc/kos/utils/kos-chain
              cp Makefile.dreamcast.cfg Makefile.cfg
              sed -i "s/^makejobs=.*/makejobs=$(nproc)/" Makefile.cfg
              make
            else
              echo "Using cached SH-4 toolchain."
            fi

      - run:
          name: Stage SH-4 toolchain for CircleCI cache
          command: |
            mkdir -p .circleci-cache
            rm -rf .circleci-cache/sh-elf
            cp -a /opt/toolchains/dc/sh-elf .circleci-cache/sh-elf

      - save_cache:
          key: kos-sh-elf-ubuntu2404-v3
          paths:
            - .circleci-cache/sh-elf

      - run:
          name: Build KallistiOS
          command: |
            if [ ! -f /opt/toolchains/dc/kos/environ.sh ]; then
              sudo mkdir -p /opt/toolchains/dc
              sudo chown -R "$USER":"$USER" /opt/toolchains
              git clone --depth 1 https://github.com/KallistiOS/KallistiOS.git /opt/toolchains/dc/kos
              cp /opt/toolchains/dc/kos/doc/environ.sh.sample /opt/toolchains/dc/kos/environ.sh
            fi
            . /opt/toolchains/dc/kos/environ.sh
            cd "$KOS_BASE"
            make -j"$(nproc)"

      - run:
          name: Download encrypted ROM using read-only SSH deploy key
          command: |
            : "${SMW_ROM_DEPLOY_KEY:?Set SMW_ROM_DEPLOY_KEY in CircleCI project environment variables}"
            install -d -m 700 ~/.ssh
            python3 - <<'PY'
            import os
            key = os.environ["SMW_ROM_DEPLOY_KEY"]
            key = key.replace("\\r", "").replace("\\n", "\n").strip()
            if len(key) >= 2 and key[0] == key[-1] and key[0] in "\\\"'":
                key = key[1:-1].strip()
            with open(os.path.expanduser("~/.ssh/id_ed25519"), "w", encoding="ascii", newline="\\n") as f:
                f.write(key + "\n")
            PY
            chmod 600 ~/.ssh/id_ed25519
            if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub; then
              echo "ERROR: SMW_ROM_DEPLOY_KEY is not a valid OpenSSH private key."
              echo "Set it to the FULL private key from ~/smw-rom-deploy (not the .pub file), preserving its BEGIN/END lines."
              exit 1
            fi
            EXPECTED_KEY='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICLmJ8fv4jm8KppeILvfci+T9oGIkKj4FaRo7JJfelx/'
            ACTUAL_KEY="$(awk '{print $1, $2}' ~/.ssh/id_ed25519.pub)"
            if [ "$ACTUAL_KEY" != "$EXPECTED_KEY" ]; then
              echo "ERROR: SMW_ROM_DEPLOY_KEY does not match the read-only deploy key registered on tester305/smw-dc-rom."
              exit 1
            fi
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
            chmod 600 ~/.ssh/known_hosts
            GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
              git clone --depth 1 --branch main \
              git@github.com:tester305/smw-dc-rom.git "$HOME/smw-dc-rom"
            cp "$HOME/smw-dc-rom/smw.sfc.gpg" ./smw.sfc.gpg
            test -s smw.sfc.gpg

      - run:
          name: Decrypt ROM and build
          command: |
            if [ -f smw.sfc.gpg ] && [ -n "${SMW_ROM_PASSPHRASE:-}" ]; then
              gpg --batch --yes --pinentry-mode loopback --passphrase "$SMW_ROM_PASSPHRASE" -o smw.sfc -d smw.sfc.gpg
            elif [ -f smw.sfc ]; then
              echo "Using supplied smw.sfc"
            else
              echo "ERROR: Add your encrypted smw.sfc.gpg file and set SMW_ROM_PASSPHRASE in CircleCI project environment variables."
              exit 1
            fi
            . /opt/toolchains/dc/kos/environ.sh
            ./build.sh smw.sfc
            rm -f smw.sfc
            test -s smw_dc.elf

      - run:
          name: Build mkdcdisc
          command: |
            git clone --depth 1 https://gitlab.com/simulant/mkdcdisc.git "$HOME/mkdcdisc"
            cd "$HOME/mkdcdisc"
            meson setup builddir
            meson compile -C builddir
            test -x builddir/mkdcdisc

      - run:
          name: Create CDI images
          command: |
            "$HOME/mkdcdisc/builddir/mkdcdisc" -e smw_dc.elf -o smw_dc_burn_ready.cdi -n "SMW"
            "$HOME/mkdcdisc/builddir/mkdcdisc" -N -e smw_dc.elf -o smw_dc.cdi -n "SMW"
            test -s smw_dc_burn_ready.cdi
            test -s smw_dc.cdi
            ls -lh smw_dc.elf smw_dc_burn_ready.cdi smw_dc.cdi

      - store_artifacts:
          path: smw_dc.elf
          destination: smw_dc.elf
      - store_artifacts:
          path: smw_dc_burn_ready.cdi
          destination: smw_dc_burn_ready.cdi
      - store_artifacts:
          path: smw_dc.cdi
          destination: smw_dc.cdi

workflows:
  build_on_push:
    jobs:
      - build
